<svg xmlns="http://www.w3.org/2000/svg" width="280" height="72" viewBox="0 0 280 72" role="img" aria-labelledby="title">
  <title id="title">Email</title>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A371F7"/>
      <stop offset=".5" stop-color="#4B2E83" stop-opacity=".25"/>
      <stop offset="1" stop-color="#A371F7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:'Fira Code',Consolas,'Courier New',monospace}
    .in{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) 0.60s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .glow{animation:glow 3s ease-in-out 1.2s infinite}
    @keyframes glow{50%{opacity:.35}}
    .nudge{animation:nudge 1.6s ease-in-out 1.2s infinite}
    @keyframes nudge{50%{transform:translateX(4px)}}
    @media (prefers-reduced-motion:reduce){
      .in{animation:none;opacity:1;transform:none}
      .glow,.nudge{animation:none}
    }
  </style>

  <g class="in">
    <rect x="2" y="2" width="276" height="68" rx="16" fill="#0F0F1B"/>
    <rect x="2" y="2" width="276" height="68" rx="16" fill="none" stroke="url(#border)" stroke-width="2"/>
    <circle class="glow" cx="44" cy="36" r="22" fill="#A371F7" opacity=".12"/>
    <rect x="30" y="26" width="28" height="20" rx="3" fill="none" stroke="#A371F7" stroke-width="2"/>
    <path d="M31,27 L44,38 L57,27" fill="none" stroke="#A371F7" stroke-width="2" stroke-linejoin="round"/>
    <text x="78" y="33" class="t" font-size="17" font-weight="800" fill="#EDE7FF">Email</text>
    <text x="78" y="52" class="m" font-size="11" fill="#8E82B5">abdelrhmanhamied004</text>
    <text x="256" y="42" class="t nudge" font-size="18" font-weight="700" fill="#A371F7" text-anchor="end">→</text>
  </g>
</svg>
