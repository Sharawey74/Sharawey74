<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-labelledby="title desc">
  <title id="title">Experience</title>
  <desc id="desc">Systems Engineering Intern at Alstom on Cairo Monorail driverless-train fault analysis; IT Infrastructure Intern at Orascom Construction; AI/ML Intern at Telecom Egypt.</desc>
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A371F7"/>
      <stop offset=".5" stop-color="#4B2E83" stop-opacity=".25"/>
      <stop offset="1" stop-color="#A371F7"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#4B2E83"/>
      <stop offset=".5" stop-color="#A371F7"/>
      <stop offset="1" stop-color="#4B2E83"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#A371F7" opacity=".18"/>
    </pattern>
    <clipPath id="card"><rect x="2" y="2" width="876" height="246" rx="16"/></clipPath>
  </defs>

  <style>
    .t{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .m{font-family:'Fira Code',Consolas,'Courier New',monospace}
    .draw{stroke-dasharray:588;stroke-dashoffset:588;animation:draw 1.8s cubic-bezier(.6,0,.2,1) .3s forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    .node{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s cubic-bezier(.3,1.6,.5,1) forwards}
    .n1{animation-delay:.3s}.n2{animation-delay:1.1s}.n3{animation-delay:1.9s}
    @keyframes pop{to{transform:scale(1)}}
    .info{opacity:0;animation:rise .7s cubic-bezier(.2,.8,.2,1) forwards}
    .i1{animation-delay:.6s}.i2{animation-delay:1.4s}.i3{animation-delay:2.2s}
    @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .ring{transform-box:fill-box;transform-origin:center;animation:ring 2.4s ease-out infinite}
    .r2{animation-delay:.8s}.r3{animation-delay:1.6s}
    @keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.6);opacity:0}}
    .comet{opacity:0;animation:fade .4s ease 2.6s forwards}
    @keyframes fade{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){
      .draw{animation:none;stroke-dashoffset:0}
      .node,.info{animation:none;opacity:1;transform:none}
      .ring,.comet{animation:none;opacity:0}
    }
  </style>

  <rect x="2" y="2" width="876" height="246" rx="16" fill="#0F0F1B"/>
  <rect width="880" height="250" fill="url(#dots)" clip-path="url(#card)"/>
  <rect x="2" y="2" width="876" height="246" rx="16" fill="none" stroke="url(#border)" stroke-width="2"/>

  <text x="32" y="39" class="m" font-size="13" font-weight="700" fill="#EDE7FF" letter-spacing="1.5">EXPERIENCE</text>
  <text x="852" y="39" class="m" font-size="12" fill="#8E82B5" text-anchor="end">3 internships · 3 industries</text>

  <!-- track + animated line -->
  <line x1="146" y1="96" x2="734" y2="96" stroke="#2A2147" stroke-width="2"/>
  <path class="draw" d="M146,96 H734" stroke="url(#line)" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- travelling comet -->
  <g class="comet">
    <circle r="5" fill="#EDE7FF" filter="url(#glow)">
      <animateMotion path="M146,96 H734" dur="3.2s" begin="2.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".5 0 .5 1"/>
    </circle>
  </g>

  <!-- node 1 -->
  <circle class="ring" cx="146" cy="96" r="12" fill="none" stroke="#A371F7"/>
  <g class="node n1">
    <circle cx="146" cy="96" r="14" fill="#161229" stroke="#A371F7" stroke-width="2"/>
    <circle cx="146" cy="96" r="6" fill="#A371F7"/>
  </g>
  <g class="info i1">
    <text x="146" y="142" class="t" font-size="17" font-weight="800" fill="#EDE7FF" text-anchor="middle">Alstom</text>
    <text x="146" y="164" class="t" font-size="13" font-weight="600" fill="#A371F7" text-anchor="middle">Systems Engineering Intern</text>
    <text x="146" y="188" class="m" font-size="11.5" fill="#8E82B5" text-anchor="middle">Cairo Monorail</text>
    <text x="146" y="205" class="m" font-size="11.5" fill="#8E82B5" text-anchor="middle">driverless-train fault analysis</text>
  </g>

  <!-- node 2 -->
  <circle class="ring r2" cx="440" cy="96" r="12" fill="none" stroke="#A371F7"/>
  <g class="node n2">
    <circle cx="440" cy="96" r="14" fill="#161229" stroke="#A371F7" stroke-width="2"/>
    <circle cx="440" cy="96" r="6" fill="#A371F7"/>
  </g>
  <g class="info i2">
    <text x="440" y="142" class="t" font-size="17" font-weight="800" fill="#EDE7FF" text-anchor="middle">Orascom Construction</text>
    <text x="440" y="164" class="t" font-size="13" font-weight="600" fill="#A371F7" text-anchor="middle">IT Infrastructure Intern</text>
    <text x="440" y="188" class="m" font-size="11.5" fill="#8E82B5" text-anchor="middle">enterprise IT infrastructure</text>
  </g>

  <!-- node 3 -->
  <circle class="ring r3" cx="734" cy="96" r="12" fill="none" stroke="#A371F7"/>
  <g class="node n3">
    <circle cx="734" cy="96" r="14" fill="#161229" stroke="#A371F7" stroke-width="2"/>
    <circle cx="734" cy="96" r="6" fill="#A371F7"/>
  </g>
  <g class="info i3">
    <text x="734" y="142" class="t" font-size="17" font-weight="800" fill="#EDE7FF" text-anchor="middle">Telecom Egypt</text>
    <text x="734" y="164" class="t" font-size="13" font-weight="600" fill="#A371F7" text-anchor="middle">AI / ML Intern</text>
    <text x="734" y="188" class="m" font-size="11.5" fill="#8E82B5" text-anchor="middle">applied machine learning</text>
  </g>
</svg>
